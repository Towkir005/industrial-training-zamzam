<!DOCTYPE html>
<html>
	<head>
		<title> Table Design</title>
		<style>
		
		#wrapper{
			width:100%;
			height:800px;
			background-color:#1abc9c;
		}
		#wrapper #header{
			width:100%;
			height:100px;
			float:left;
			position:relative;
			background-color:#2ecc71;
		 }
		#content{
			width:100%;
			height:600px;
			float:left;
			position:relative;
			background-color:#3498db;
		 }
		#content .about{
			width:50%;
			height:600px;
			float:left;
			position:relative;
			background-color:#9b59b6;
		}
		.about .box-1{
			width:100%;
			height:300px;
			float:left;
			position:relative;
			background-color:#f1c40f;
		}
		.about .box-2{
			width:100%;
			height:300px;
			float:left;
			position:relative;
			background-color:#40739e;
		}
		.box-2 .item-1{
			width:33.33%;
			height:300px;
			float:left;
			position:relative;
			background-color:#273c75;
		}
		.box-2 .item-2{
			width:33.33%;
			height:300px;
			float:left;
			position:relative;
			background-color:#0097e6;
		}
		.box-2 .item-3{
			width:33.33%;
			height:300px;
			float:left;
			position:relative;
			background-color:#10ac84;
		}
		
		
		#content .section{
			width:50%;
			height:600px;
			float:left;
			position:relative;
			background-color:#34495e;
		}
		
		#footer{
			width:100%;
			height:100px;
			float:left;
			position:relative;
			background-color:#d35400;
		}
		 
		 
		 
		</style>
	</head>
	<body>
		<div id="wrapper">
			<div id="header"></div>
			    <!---inner class start---->
				 
			<div id="content">
				<div class="about">
					<div class="box-1"></div>
					<div class="box-2">
						<div class="item-1"></div>
						<div class="item-2"></div>
						<div class="item-3"></div>
					</div>
				</div>
				<div class="section"></div>
			</div>
				<!---inner class start---->
			<div id="footer"></div>
		</div>
	</body>
</html>
